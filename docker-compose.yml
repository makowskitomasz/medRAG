services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: weaviate
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Services ─────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: api-gateway
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: auth
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: admin
    ports:
      - "8012:8000"
    env_file: .env
    depends_on:
      mongo: { condition: service_healthy }
      weaviate: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ingestion
    ports:
      - "8007:8000"
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  parser:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: parser
    ports:
      - "8008:8000"
    env_file: .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  chunking:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: chunking
    ports:
      - "8009:8000"
    env_file: .env
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  embedding:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: embedding
    ports:
      - "8010:8000"
    env_file: .env
    environment:
      HF_HOME: /app/.cache/huggingface
    volumes:
      - embedding_cache:/app/.cache/huggingface
    depends_on:
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  indexing:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: indexing
    ports:
      - "8011:8000"
    env_file: .env
    depends_on:
      mongo: { condition: service_healthy }
      weaviate: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  retrieval:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: retrieval
    ports:
      - "8004:8000"
    env_file: .env
    depends_on:
      mongo: { condition: service_healthy }
      weaviate: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  reranker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: reranker
    ports:
      - "8005:8000"
    env_file: .env
    environment:
      HF_HOME: /app/.cache/huggingface
    volumes:
      - reranker_cache:/app/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 4g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  query-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: query-processor
    ports:
      - "8003:8000"
    env_file: .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  generation:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: generation
    ports:
      - "8006:8000"
    env_file: .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: orchestrator
    ports:
      - "8002:8000"
    env_file: .env
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      retrieval: { condition: service_healthy }
      reranker: { condition: service_healthy }
      generation: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  eval:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: eval
    ports:
      - "8013:8000"
    env_file: .env
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      generation: { condition: service_healthy }
      embedding: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  weaviate_data:
  rabbitmq_data:
  uploads_data:
  reranker_cache:
  embedding_cache:
